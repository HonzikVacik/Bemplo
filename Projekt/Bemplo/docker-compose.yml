version: "3.9"

services:
  db:
    image: postgres:16
    container_name: bemplo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Pokud nechceš k DB přistupovat napřímo zvenčí (např. přes DBeaver), můžeš toto mapování smazat
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bemplo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Bemplo.Server/Dockerfile
    container_name: bemplo-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production" # Změněno z Development na Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # API běží čistě interně uvnitř Docker sítě na portu 8080 (jak to máš v Dockerfile)
      ASPNETCORE_URLS: "http://+:8080" 
    # Smazali jsme sekci ports. API už nekomunikuje přímo s internetem, ale přes Caddy.
    depends_on:
      - db

  caddy:
    image: caddy:2
    container_name: bemplo-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP provoz
      - "443:443" # HTTPS provoz (certifikáty se vygenerují automaticky)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # Odkaz na konfigurační soubor Caddy
      - caddy_data:/data # Důležité: Sem se trvale ukládají Let's Encrypt certifikáty
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config: