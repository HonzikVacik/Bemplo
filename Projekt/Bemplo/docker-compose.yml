version: "3.9"

services:
  db:
    image: postgres:16
    container_name: bemplo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bemplo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Bemplo.Server/Dockerfile
    container_name: bemplo-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Override the connection string to use the dockerized Postgres
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # You can override JWT settings here if needed; otherwise appsettings.json values are used
      # JwtSettings__SecretKey: "YourSecretKey1234567890secretkeyfordemo"
      # JwtSettings__Issuer: "http://localhost:8080"
      # JwtSettings__Audience: "http://localhost:8080"
      ASPNETCORE_URLS: "http://+:80"
      #ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      #ASPNETCORE_Kestrel__Certificates__Default__Password: "tajneheslocertifikatu"
    ports:
      - "80:80"
    depends_on:
      - db

volumes:
  db_data:


